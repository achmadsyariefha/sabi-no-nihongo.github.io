[package]
name = "sabi-web"
description = "Sabi no Nihongo web app (Leptos, client-side rendered)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sabi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8"
gloo-storage = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "Document",
    "DomTokenList",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "MediaQueryList",
    "Node",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
    "Storage",
    "Url",
    "Window",
] }
