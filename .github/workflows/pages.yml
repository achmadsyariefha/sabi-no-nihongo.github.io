name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p sabi-core -p sabi-web

      - name: Clippy
        run: cargo clippy -p sabi-core -p sabi-web --target wasm32-unknown-unknown -- -D warnings

      - name: Install Trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      # A repo named <owner>.github.io is served at the domain root; any other
      # repo is a project site served under /<repo>/.
      - name: Pick public URL
        id: url
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "${owner}.github.io" ]; then
            echo "public_url=/" >> "$GITHUB_OUTPUT"
          else
            echo "public_url=/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # Prefills the sign-in form's server address. Override it with a
        # repository variable named SABI_API_URL.
        env:
          SABI_API_URL: ${{ vars.SABI_API_URL || 'https://sabi-no-nihongo-sync.vercel.app' }}
        run: trunk build --release --public-url "${{ steps.url.outputs.public_url }}"

      # Lets deep links like /vault load the app instead of a GitHub 404.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The optional sync server. Not deployed from here; this only checks it.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sabi
          POSTGRES_PASSWORD: sabi
          POSTGRES_DB: sabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SABI_TEST_DATABASE_URL: postgres://sabi:sabi@localhost:5432/sabi_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p sabi-server --all-targets -- -D warnings

      - name: Test
        run: cargo test -p sabi-server

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
