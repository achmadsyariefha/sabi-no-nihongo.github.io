[workspace]
resolver = "3"
members = ["crates/core", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sabi-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small WASM output for GitHub Pages.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
