# Render Blueprint for the optional sync server (free plan, no card needed).
# In Render: New → Blueprint → pick this repo. It asks for DATABASE_URL
# (paste the Neon connection string); JWT_SECRET is generated for you.
# The web app on GitHub Pages is deployed separately by .github/workflows/pages.yml.
services:
  - type: web
    name: sabi-no-nihongo-sync
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./crates/server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Only redeploy when the server or the shared core changes.
    buildFilter:
      paths:
        - crates/server/**
        - crates/core/**
        - Cargo.toml
        - Cargo.lock
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://achmadsyariefha.github.io
      - key: RUST_LOG
        value: info
